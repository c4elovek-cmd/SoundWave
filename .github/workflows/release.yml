name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка установщика Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка и упаковка
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись не настроена — не ищем сертификаты на машине.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Прикрепление файлов к релизу
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem -Path release -File | Where-Object { $_.Extension -in ".exe", ".blockmap" } | ForEach-Object { $_.FullName })
          if (-not $assets) { throw "Артефакты не найдены в release/" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Релиз $tag уже есть — обновляем файлы"
            gh release upload $tag @assets --clobber
            gh release edit $tag --draft=false --title "SoundWave $tag"
          } else {
            gh release create $tag @assets --generate-notes --title "SoundWave $tag"
          }

          # gh иногда оставляет рядом черновик с тем же тегом — убираем его
          $drafts = gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft == true and .tag_name == `"$tag`") | .id"
          foreach ($id in $drafts) {
            Write-Output "Удаляем черновик $id"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$id"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
