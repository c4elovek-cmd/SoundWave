name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка установщика Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка и упаковка
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись не настроена — не ищем сертификаты на машине.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Прикрепление файлов к релизу
        run: |
          gh release create "${{ github.ref_name }}" \
            release/SoundWave-Setup-*.exe \
            release/SoundWave-Portable-*.exe \
            release/*.blockmap \
            --generate-notes \
            --title "SoundWave ${{ github.ref_name }}" \
            || gh release upload "${{ github.ref_name }}" \
            release/SoundWave-Setup-*.exe \
            release/SoundWave-Portable-*.exe \
            release/*.blockmap \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
